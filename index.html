<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Bio Vibes</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>

<body>

<div class="bg"></div>

<div class="container">

<div id="homePage">

<div class="glass">

<h1>✨ AI BIO VIBES</h1>

<p class="subtitle">
Paste your Instagram, X or WhatsApp Bio and let AI judge it.
</p>

<textarea
id="bio"
maxlength="300"
placeholder="Type your bio here..."></textarea>

<div class="count">
<span id="chars">0</span>/300
</div>

<div class="buttons">

<button id="generate">
Generate
</button>

<button id="clear">
Clear
</button>

</div>

</div>

</div>

  <div id="resultPage" class="hidden">

<div id="loader" class="loader hidden">

<h2>Analyzing...</h2>

<div class="step">

<div class="number">
1
</div>
</div>

<div>

<h3>Reading Bio...</h3>

<div class="progress">
<div class="bar" id="bar1"></div>
</div>

</div>

</div>

<div class="step">

<div class="number">
2
</div>

<div>

<h3>Finding Vibe...</h3>

<div class="progress">
<div class="bar" id="bar2"></div>
</div>

</div>

</div>

<div class="step">

<div class="number">
3
</div>

<div>

<h3>Generating Roast...</h3>

<div class="progress">
<div class="bar" id="bar3"></div>
</div>

</div>

</div>

</div>

<div id="result" class="hidden">

<div id="postcard">

<h1>✨ AI BIO VIBES</h1>

<div class="bioCard">

<h2>Your Bio</h2>

<p id="bioResult"></p>

</div>

<div class="card">

<h2>
🔥 Roast
</h2>

<p id="roast"></p>

</div>

<div class="card">

<h2>
😎 Hype
</h2>

<p id="hype"></p>

</div>

<div class="card">

<h2>
✨ Vibe
</h2>

<p id="vibe"></p>

</div>

<div class="footer">

Made with AI Bio Vibes

</div>

</div>

<div class="actions">

<button id="download">

⬇ Download

</button>

<button id="share">

𝕏 Share on X

</button>

<button id="again">

Generate Again

</button>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
